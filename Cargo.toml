[package]
name = "libfabric-rs"
version = "0.1.0"
edition = "2021"
authors = ["Philipp Sippl"]
description = "Async Rust wrapper for libfabric with EFA support"
license = "MIT"
repository = "https://github.com/philsippl/libfabric-efa-rs"
readme = "README.md"
keywords = ["libfabric", "rdma", "efa", "networking", "async"]
categories = ["network-programming", "asynchronous"]

[dependencies]
tokio = { version = "1.40", features = ["net", "rt", "sync", "io-util", "time"] }
eyre = "0.6"
serde = { version = "1.0", features = ["derive"] }
ofi-libfabric-sys = "0.1.0"
libc = "0.2.189"

[dev-dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
